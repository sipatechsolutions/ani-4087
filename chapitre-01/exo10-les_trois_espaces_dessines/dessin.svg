<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="sans-serif">
  <rect x="0" y="0" width="720" height="480" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Les trois espaces vus de cote : ou atterrit une table a 0,80 m ?</text>
  <text x="360" y="45" text-anchor="middle" font-size="12" fill="#666">Echelle : 100 px = 1 m. Piece de 2,5 m de haut.</text>

  <rect x="120" y="90" width="510" height="250" fill="#f7f9fb" stroke="#333" stroke-width="3"/>
  <text x="622" y="106" text-anchor="end" font-size="11" fill="#888">plafond 2,5 m</text>
  <text x="128" y="333" font-size="11" fill="#888">sol (plancher)</text>

  <g font-size="10" fill="#555" text-anchor="end">
    <line x1="120" y1="340" x2="114" y2="340" stroke="#999"/><text x="110" y="344">0 m</text>
    <line x1="120" y1="260" x2="114" y2="260" stroke="#999"/><text x="110" y="264">0,8 m</text>
    <line x1="120" y1="180" x2="114" y2="180" stroke="#999"/><text x="110" y="184">1,6 m</text>
    <line x1="120" y1="100" x2="114" y2="100" stroke="#999"/><text x="110" y="104">2,4 m</text>
  </g>

  <line x1="120" y1="260" x2="630" y2="260" stroke="#2a9d63" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="624" y="254" text-anchor="end" font-size="10" fill="#2a9d63">0,8 m (vraie table)</text>

  <g stroke="#243b53" stroke-width="3" fill="none">
    <circle cx="230" cy="168" r="14" fill="#cfe0f0"/>
    <line x1="230" y1="182" x2="230" y2="262"/>
    <line x1="206" y1="215" x2="254" y2="215"/>
    <line x1="230" y1="262" x2="214" y2="340"/>
    <line x1="230" y1="262" x2="246" y2="340"/>
  </g>
  <circle cx="236" cy="166" r="2.5" fill="#243b53"/>

  <circle cx="230" cy="340" r="6" fill="#2a9d63"/>
  <text x="242" y="352" font-size="11" fill="#1c7a43" font-weight="bold">O STAGE</text>
  <text x="242" y="365" font-size="10" fill="#1c7a43">origine au sol (y=0 = plancher)</text>

  <circle cx="180" cy="180" r="6" fill="#2a6cb8"/>
  <line x1="180" y1="180" x2="150" y2="165" stroke="#2a6cb8" stroke-width="1"/>
  <text x="24" y="150" font-size="11" fill="#1e5aa0" font-weight="bold">O LOCAL</text>
  <text x="24" y="163" font-size="10" fill="#1e5aa0">origine a hauteur des</text>
  <text x="24" y="175" font-size="10" fill="#1e5aa0">yeux au recentrage (~1,6 m)</text>

  <circle cx="251" cy="166" r="6" fill="#c0392b"/>
  <text x="266" y="162" font-size="11" fill="#a4321f" font-weight="bold">O VIEW</text>
  <text x="266" y="175" font-size="10" fill="#a4321f">origine a l'oeil (suit la tete)</text>

  <g stroke="#1c7a43" stroke-width="3">
    <line x1="380" y1="260" x2="470" y2="260"/>
    <line x1="386" y1="260" x2="386" y2="340"/>
    <line x1="464" y1="260" x2="464" y2="340"/>
  </g>
  <text x="425" y="300" text-anchor="middle" font-size="10" fill="#1c7a43" font-weight="bold">table STAGE</text>
  <text x="425" y="313" text-anchor="middle" font-size="9" fill="#1c7a43">0,8 m du sol = OK</text>

  <g stroke="#e2942e" stroke-width="3">
    <line x1="500" y1="100" x2="590" y2="100"/>
    <line x1="506" y1="100" x2="506" y2="128"/>
    <line x1="584" y1="100" x2="584" y2="128"/>
  </g>
  <text x="545" y="145" text-anchor="middle" font-size="9.5" fill="#b4720f">table LOCAL : monte a 2,4 m</text>
  <text x="545" y="157" text-anchor="middle" font-size="9" fill="#b4720f">(0,8 m au-dessus des yeux)</text>

  <g stroke="#c0392b" stroke-width="3">
    <line x1="300" y1="100" x2="365" y2="100"/>
    <line x1="306" y1="100" x2="306" y2="125"/>
    <line x1="359" y1="100" x2="359" y2="125"/>
  </g>
  <text x="332" y="90" text-anchor="middle" font-size="9.5" fill="#a4321f">table VIEW (0,8 m au-dessus de l'oeil)</text>
  <path d="M332,126 C332,150 290,160 256,168" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="300" y="200" text-anchor="middle" font-size="9" fill="#a4321f">et suit la tete</text>

  <text x="360" y="402" text-anchor="middle" font-size="12" fill="#1c7a43" font-weight="bold">Seul STAGE place la table a la bonne hauteur reelle (0,8 m du sol).</text>
  <text x="360" y="420" text-anchor="middle" font-size="11" fill="#555">Dans LOCAL elle monte a 2,4 m ; dans VIEW elle flotte devant les yeux et bouge avec la tete.</text>
</svg>
