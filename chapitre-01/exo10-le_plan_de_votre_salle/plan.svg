<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" font-family="sans-serif">
  <rect x="0" y="0" width="520" height="460" fill="#ffffff"/>
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Plan de la salle — 4 m × 3 m (hauteur 2,5 m)</text>

  <!-- Sol / murs -->
  <rect x="60" y="60" width="400" height="300" fill="#f7f4ee" stroke="#333333" stroke-width="8"/>

  <!-- Fenetres (mur du haut) -->
  <line x1="110" y1="60" x2="230" y2="60" stroke="#4a90d9" stroke-width="8"/>
  <line x1="290" y1="60" x2="410" y2="60" stroke="#4a90d9" stroke-width="8"/>
  <text x="170" y="52" text-anchor="middle" font-size="12" fill="#2b6ca3">fenêtre 1,2 m</text>
  <text x="350" y="52" text-anchor="middle" font-size="12" fill="#2b6ca3">fenêtre 1,2 m</text>

  <!-- Porte (mur du bas) : ouverture + battant + arc -->
  <rect x="173" y="351" width="94" height="18" fill="#ffffff"/>
  <line x1="175" y1="360" x2="175" y2="272" stroke="#8a6d3b" stroke-width="3"/>
  <path d="M175,272 A88,88 0 0 1 263,360" fill="none" stroke="#8a6d3b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="219" y="388" text-anchor="middle" font-size="12" fill="#6b4f1d">porte 0,9 m (h 2 m)</text>

  <!-- Table -->
  <rect x="280" y="185" width="120" height="80" fill="#d9c3a5" stroke="#8a6d3b" stroke-width="2"/>
  <text x="340" y="172" text-anchor="middle" font-size="12" fill="#6b4f1d">table 1,2 × 0,8 m (h 0,8 m)</text>

  <!-- Objet pose sur la table -->
  <rect x="334" y="219" width="12" height="12" fill="#c0392b"/>
  <text x="340" y="250" text-anchor="middle" font-size="11" fill="#8c2a1f">objet 0,1 m</text>

  <!-- Cotes -->
  <text x="260" y="392" text-anchor="middle" font-size="13" fill="#333">4 m</text>
  <text x="36" y="210" text-anchor="middle" font-size="13" fill="#333" transform="rotate(-90 36 210)">3 m</text>
</svg>
